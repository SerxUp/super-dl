name: yt-dlp release

# When PyPI has a newer yt-dlp than the floor in pyproject.toml: bump the
# floor and the patch version, test, tag, and publish via build.yml.
on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write  # push the bump commit and tag
  actions: write   # dispatch build.yml

concurrency:
  group: yt-dlp-release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compare PyPI yt-dlp with pyproject floor
        id: check
        run: python scripts/bump_ytdlp.py --dry-run

  release:
    needs: check
    # Manual runs on other branches stop at the check, so the workflow can be
    # exercised without cutting a release.
    if: needs.check.outputs.bumped == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Bump yt-dlp floor and patch version
        id: bump
        run: python scripts/bump_ytdlp.py

      - name: Install Linux Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          YTDLP: ${{ steps.bump.outputs.ytdlp }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump yt-dlp to $YTDLP and version to $VERSION"
          git tag -a "v$VERSION" -m "$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      # A tag pushed with GITHUB_TOKEN doesn't trigger build.yml's tag push
      # event; workflow_dispatch is the exception GitHub allows.
      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh workflow run build.yml --ref "v$VERSION"
