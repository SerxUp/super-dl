[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-dl"
version = "0.4.1"
description = "Lightweight cross-platform GUI for yt-dlp"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "Sergio A." }]
dependencies = [
    "PySide6>=6.11",
    "platformdirs>=4.11",
    "yt-dlp[default]>=2026.8.19",
    "imageio-ffmpeg>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-qt>=4.5",
    "ruff>=0.16",
    "pyinstaller>=6.21",
]

[project.gui-scripts]
super-dl = "super_dl.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["super_dl"]
artifacts = ["super_dl/resources/i18n/*.qm"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
